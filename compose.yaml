
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: admincond_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - admincond_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d admincond_dev
      interval: 5s
      timeout: 3s
      retries: 10

  receipts-init:
    image: alpine:3.21
    user: root
    command:
      - sh
      - -c
      - mkdir -p /receipts && chown -R 1000:1000 /receipts && chmod 700 /receipts
    volumes:
      - admincond_receipts:/receipts
    restart: "no"

  api:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      RECEIPTS_DIR: /app/private_receipts
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./backend/src:/app/src:ro
      - admincond_receipts:/app/private_receipts
    depends_on:
      postgres:
        condition: service_healthy
      receipts-init:
        condition: service_completed_successfully

volumes:
  admincond_pgdata:
  admincond_receipts:
